<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akhil Sharma's Project Portfolio</title>
    <style>
        /* Global styles for body and wrapper */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #B3A369;
            color: #333;
            display: flex;
            justify-content: center;
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            max-width: 1200px; /* Adjust width to match the desired look */
            width: 100%;
            margin: 0 auto;
        }

        /* Header styles */
        header {
            background-color: #002855;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 10px 10px 10px -8px rgba(0, 0, 0, 0.8);
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            max-width: 1200px; /* Limit the width */
            margin: 0 auto 20px auto; /* Center align */
        }

        header img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
        }

        header h1 {
            font-size: 2.5em;
        }

        /* Footer styles */
        footer {
            text-align: center;
            padding: 20px;
            background-color: #333;
            color: white;
            margin-top: 40px;
            max-width: 1200px; /* Limit the width */
            margin: 40px auto 0 auto; /* Center align */
        }

        footer a {
            color: #8DD5E7;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* Project container styles */
        .project {
            background-color: #B5D6ED;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 10px 10px 10px -8px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            position: relative;
            max-width: 1200px; /* Limit the width */
            margin: 0 auto 20px auto; /* Center align and add spacing */
        }

        .project-content {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            margin-bottom: 20px;
        }

        .project-image {
            flex: 0 0 25%;
            margin-right: 20px;
        }

        .project-image img {
            width: 100%;
            max-width: 300px;
            max-height: 300px;
            border-radius: 8px;
            object-fit: cover; /* Ensure the image fills the space while maintaining aspect ratio */
        }

        .project-text {
            flex-grow: 1;
        }

        .project h2 {
            font-size: 30px;
            margin-top: 0;
        }

        .read-more {
            display: none;
            text-align: left;
            margin-top: 20px;
        }

        .project-summary {
            margin: 10px 0;
            font-size: 22px;
        }

        .project-buttons {
            display: flex;
            justify-content: space-between; /* Evenly distribute the buttons */
            width: 300px; /* Limit the total width to 300px */
            margin-top: 10px;
        }

        .project button {
            background-color: #002855;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            flex: 1;
            margin-right: 10px; /* Space between the buttons */
        }

        .project button:last-child {
            margin-right: 0;
        }

        .project button:hover {
            background-color: #002855;
        }

        .project button.view-code {
            background-color: #4CAF50;
        }

        .project button.view-code:hover {
            background-color: #45a049;
        }
    </style>
    <script>
        function toggleReadMore(button, projectId) {
            var readMoreSection = document.getElementById('read-more-' + projectId);
            
            if (readMoreSection.style.display === 'block') {
                readMoreSection.style.display = 'none';
                button.innerHTML = 'Read More'; // Change button to "Read More"
            } else {
                readMoreSection.style.display = 'block';
                button.innerHTML = 'Read Less'; // Change button to "Read Less"
            }
        }
    </script>
</head>
<body>

<div class="wrapper">
    <!-- Header with photo and title -->
    <header>
        <img src="Images/grad_photo.jpg" alt="Your Photo">
        <h1>Akhil Sharma's Project Portfolio</h1>
    </header>

    <!-- Main content -->
    <div class="container">
        <!-- Project sections go here -->
        
        <!-- Example project section for clarity -->
        <div class="project">
            <div class="project-content">
                <div class="project-image">
                    <img src="Images/example.jpg" alt="Example Project">
                </div>
                <div class="project-text">
                    <h2>Example Project Title</h2>
                    <p class="project-summary">Example project summary text goes here.</p>
                </div>
            </div>
            <div class="project-buttons">
                <button onclick="toggleReadMore(this, 1)">Read More</button>
                <button class="view-code">View Code</button>
            </div>
            <div class="read-more" id="read-more-1">
                <p>Additional project details go here.</p>
            </div>
        </div>

    </div>

    <footer>
        <p>Connect with me on <a href="https://www.linkedin.com/in/akhsharma/">LinkedIn</a> | School Email: <a href="mailto:akhsharma@ucdavis.edu">akhsharma@ucdavis.edu</a> | Email: <a href="mailto:theakkuking@gmail.com">theakkuking@gmail.com</a></p>
    </footer>
</div>

</body>
</html>
